# ═══════════════════════════════════════════════════════════════
# TrendRadar 配置文件（植物灯 + 农业版）
# ═══════════════════════════════════════════════════════════════

# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "Asia/Shanghai"        # 时区
  show_version_update: true        # 显示版本更新提示


# ===============================================================
# 2. 数据源 - 热榜平台
# ===============================================================
platforms:
  - id: "toutiao"
    name: "今日头条"
  - id: "baidu"
    name: "百度热搜"
  - id: "wallstreetcn-hot"
    name: "华尔街见闻"
  - id: "thepaper"
    name: "澎湃新闻"
  - id: "bilibili-hot-search"
    name: "bilibili 热搜"
  - id: "cls-hot"
    name: "财联社热门"
  - id: "ifeng"
    name: "凤凰网"
  - id: "tieba"
    name: "贴吧"
  - id: "weibo"
    name: "微博"
  - id: "douyin"
    name: "抖音"
  - id: "zhihu"
    name: "知乎"


# ===============================================================
# 3. 数据源 - RSS 订阅（植物灯 + 农业）
# ===============================================================
rss:
  enabled: true  # 是否启用 RSS 抓取

  # 全局新鲜度过滤：默认只要最近 7 天的文章
  freshness_filter:
    enabled: true
    max_age_days: 7

  # RSS 源列表
  feeds:
    # -----------------------------------------------------------
    # 植物照明 / 植物工厂 / 垂直农业 / CEA（英文）
    # -----------------------------------------------------------
    - id: "google-led-grow-light"
      name: "Google News - LED grow light"
      url: "https://news.google.com/rss/search?q=%22LED%20grow%20light%22&hl=en-US&gl=US&ceid=US:en"

    - id: "google-horticulture-lighting"
      name: "Google News - horticulture lighting"
      url: "https://news.google.com/rss/search?q=%22horticulture%20lighting%22%20OR%20%22grow%20lighting%22&hl=en-US&gl=US&ceid=US:en"

    - id: "google-greenhouse-lighting"
      name: "Google News - greenhouse lighting"
      url: "https://news.google.com/rss/search?q=%22greenhouse%20lighting%22%20OR%20%22supplemental%20lighting%22%20greenhouse&hl=en-US&gl=US&ceid=US:en"

    - id: "google-vertical-farming"
      name: "Google News - vertical / indoor farming"
      url: "https://news.google.com/rss/search?q=%22vertical%20farming%22%20OR%20%22indoor%20farming%22%20OR%20%22indoor%20agriculture%22&hl=en-US&gl=US&ceid=US:en"

    - id: "google-cea"
      name: "Google News - controlled environment agriculture (CEA)"
      url: "https://news.google.com/rss/search?q=%22controlled%20environment%20agriculture%22%20OR%20%22CEA%20greenhouse%22&hl=en-US&gl=US&ceid=US:en"

    # -----------------------------------------------------------
    # 植物照明 / 设施农业 / 智慧农业 / 农业资本（中文）
    # -----------------------------------------------------------
    - id: "google-cn-plant-light"
      name: "谷歌新闻 - 植物照明 / 补光灯"
      url: "https://news.google.com/rss/search?q=%E6%A4%8D%E7%89%A9%E7%85%A7%E6%98%8E%20OR%20%E6%A4%8D%E7%89%A9%E8%A1%A5%E5%85%89%20OR%20%E6%A4%8D%E7%89%A9%E7%94%9F%E9%95%BF%E7%81%AF&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
      max_age_days: 10   # 中文这条适当放宽一点，避免太少

    - id: "google-cn-facility-agri"
      name: "谷歌新闻 - 植物工厂 / 温室农业 / 设施农业"
      url: "https://news.google.com/rss/search?q=%E6%A4%8D%E7%89%A9%E5%B7%A5%E5%8E%82%20OR%20%E6%B8%A9%E5%AE%A4%E5%86%9C%E4%B8%9A%20OR%20%E6%96%BD%E8%AE%BE%E5%86%9C%E4%B8%9A%20OR%20%E6%B8%A9%E5%AE%A4%E5%B7%A5%E7%A8%8B&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
      max_age_days: 10

    - id: "google-cn-smart-agri"
      name: "谷歌新闻 - 智慧农业 / 数字农业 / 农业物联网"
      url: "https://news.google.com/rss/search?q=%E6%99%BA%E6%85%A7%E5%86%9C%E4%B8%9A%20OR%20%E6%95%B0%E5%AD%97%E5%86%9C%E4%B8%9A%20OR%20%E5%86%9C%E4%B8%9A%E7%89%A9%E8%81%94%E7%BD%91&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
      max_age_days: 10

    - id: "google-cn-agri-capital"
      name: "谷歌新闻 - 农业园区 / 设施农业投资 / 乡村振兴"
      url: "https://news.google.com/rss/search?q=%E5%86%9C%E4%B8%9A%E5%9B%AD%E5%8C%BA%20OR%20%E7%8E%B0%E4%BB%A3%E5%86%9C%E4%B8%9A%E4%BA%A7%E4%B8%9A%E5%9B%AD%20OR%20%E8%AE%BE%E6%96%BD%E5%86%9C%E4%B8%9A%20OR%20%E4%B9%A1%E6%9D%91%E6%8C%AF%E5%85%B4%20OR%20%E5%86%9C%E4%B8%9A%E6%8A%95%E8%B5%84&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
      max_age_days: 15   # 投融资&园区类节奏更慢一些


# ===============================================================
# 4. 报告模式
# ===============================================================
report:
  # 模式：daily | current | incremental
  mode: "current"

  # 展示方式：keyword 按关键词分组；platform 按平台分组
  display_mode: "keyword"

  rank_threshold: 5
  sort_by_position_first: false
  max_news_per_keyword: 0        # 0 = 不限制
  reverse_content_order: false


# ===============================================================
# 5. 推送通知
# ===============================================================
notification:
  enabled: true

  # 推送时间窗口（你现在是 GitHub Actions 定时跑，可关掉）
  push_window:
    enabled: false
    start: "20:00"
    end: "22:00"
    once_per_day: true

  # 独立展示区（可以单独拉某个平台 / 某个 RSS 出来）
  standalone_display:
    enabled: false
    platforms: []        # 例如 ["zhihu", "weibo"]
    rss_feeds: []        # 例如 ["google-led-grow-light"]
    max_items: 20

  # 各渠道配置（敏感信息建议用 GitHub Secrets 覆盖）
  channels:
    feishu:
      webhook_url: ""
    dingtalk:
      webhook_url: ""
    wework:
      webhook_url: ""
      msg_type: "markdown"   # markdown | text
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""          # 发件邮箱（可留空，用 Secrets 覆盖）
      password: ""      # 授权码（可留空，用 Secrets 覆盖）
      to: ""            # 收件邮箱，多个用逗号
      smtp_server: ""   # 留空走自动识别
      smtp_port: ""     # 留空走自动识别
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""


# ===============================================================
# 6. 存储配置
# ===============================================================
storage:
  # auto = GitHub Actions 时优先用远程；否则用本地
  backend: "auto"

  formats:
    sqlite: true
    txt: false
    html: true   # 邮件必须开

  local:
    data_dir: "output"
    retention_days: 0   # 0 = 永久

  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""

  pull:
    enabled: false
    days: 7


# ===============================================================
# 7. AI 分析功能
# ===============================================================
ai_analysis:
  enabled: true               # 没配置 AI_API_KEY 的话，抓取不受影响
  provider: "deepseek"
  api_key: ""                 # 建议用环境变量 AI_API_KEY
  model: "deepseek-chat"
  base_url: ""
  timeout: 90

  # 推送模式：only_analysis | both
  push_mode: "both"

  # 参与分析的新闻条数上限
  max_news_for_analysis: 50

  # 是否把 RSS 一起拿去分析
  include_rss: false          # 先关着，等你觉得 RSS 质量 OK 再开

  # 提示词文件
  prompt_file: "ai_analysis_prompt.txt"


# ===============================================================
# 8. 高级设置
# ===============================================================
advanced:
  debug: false

  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"

  crawler:
    enabled: true
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"

  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""
    notification_enabled: true

  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1

  max_accounts_per_channel: 3

  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000

  batch_send_interval: 3

  feishu_message_separator: "━━━━━━━━━━━━━━━━━━━"
