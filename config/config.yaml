# ═══════════════════════════════════════════════════════════════
# TrendRadar 配置文件（植物灯行业专用）
# ═══════════════════════════════════════════════════════════════

# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  # 时区配置
  timezone: "Asia/Shanghai"
  show_version_update: true  # 显示版本更新提示


# ===============================================================
# 2. 数据源 - 热榜平台
# ===============================================================
platforms:
  - id: "toutiao"
    name: "今日头条"
  - id: "baidu"
    name: "百度热搜"
  - id: "wallstreetcn-hot"
    name: "华尔街见闻"
  - id: "thepaper"
    name: "澎湃新闻"
  - id: "bilibili-hot-search"
    name: "bilibili 热搜"
  - id: "cls-hot"
    name: "财联社热门"
  - id: "ifeng"
    name: "凤凰网"
  - id: "tieba"
    name: "贴吧"
  - id: "weibo"
    name: "微博"
  - id: "douyin"
    name: "抖音"
  - id: "zhihu"
    name: "知乎"


# ===============================================================
# 3. 数据源 - RSS 订阅（植物灯相关）
# ===============================================================
rss:
  enabled: true  # 是否启用 RSS 抓取

  # 文章新鲜度过滤配置（全局默认值）
  freshness_filter:
    enabled: true
    max_age_days: 7   # 全局默认：只推送 7 天内的文章

  # RSS 源列表：这里我用 Google News 搜索，专门抓“植物灯 / 温室补光”等新闻
  feeds:
    - id: "google-led-grow-light"
      name: "Google News - LED grow light"
      url: "https://news.google.com/rss/search?q=%22LED+grow+light%22&hl=en-US&gl=US&ceid=US:en"

    - id: "google-horticulture-lighting"
      name: "Google News - horticulture lighting"
      url: "https://news.google.com/rss/search?q=%22horticulture+lighting%22+OR+%22grow+lighting%22&hl=en-US&gl=US&ceid=US:en"

    - id: "google-greenhouse-lighting"
      name: "Google News - greenhouse lighting"
      url: "https://news.google.com/rss/search?q=%22greenhouse+lighting%22+OR+%22supplemental+lighting%22+greenhouse&hl=en-US&gl=US&ceid=US:en"

    - id: "google-cannabis-grow"
      name: "Google News - cannabis grow lighting"
      url: "https://news.google.com/rss/search?q=%22cannabis%22+grow+light+OR+%22cannabis+cultivation%22+LED&hl=en-US&gl=US&ceid=US:en"

    - id: "google-cn-plant-light"
      name: "谷歌新闻 - 植物补光灯"
      url: "https://news.google.com/rss/search?q=%E6%A4%8D%E7%89%A9%E7%94%9F%E9%95%BF%E7%81%AF+OR+%E6%A4%8D%E7%89%A9%E8%A1%A5%E5%85%89%E7%81%AF+OR+%E6%A4%8D%E7%89%A9%E5%85%89%E7%85%A7&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
      max_age_days: 10   # 中文这条允许再老一点，避免新闻太少


# ===============================================================
# 4. 报告模式
# ===============================================================
report:
  # 模式：daily | current | incremental
  mode: "current"
  # 展示方式：keyword 按关键词分组；platform 按平台分组
  display_mode: "keyword"
  rank_threshold: 5
  sort_by_position_first: false
  max_news_per_keyword: 0    # 0 = 不限制
  reverse_content_order: false


# ===============================================================
# 5. 推送通知
# ===============================================================
notification:
  enabled: true

  # 推送时间窗口（你现在是 GitHub Actions 定时跑，可以先关着）
  push_window:
    enabled: false
    start: "20:00"
    end: "22:00"
    once_per_day: true

  # 独立展示区（比如想完整看某个平台的热榜 / 某个 RSS）
  standalone_display:
    enabled: false
    platforms: []   # 例如 ["zhihu", "weibo"]
    rss_feeds: []   # 例如 ["google-led-grow-light"]
    max_items: 20

  # 各渠道具体配置（敏感信息建议放 GitHub Secrets，这里留空）
  channels:
    feishu:
      webhook_url: ""
    dingtalk:
      webhook_url: ""
    wework:
      webhook_url: ""
      msg_type: "markdown"   # markdown | text
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""          # 发件邮箱（可留空，用 Secrets 覆盖）
      password: ""      # 授权码（可留空，用 Secrets 覆盖）
      to: ""            # 收件邮箱，多个用逗号
      smtp_server: ""   # 留空走自动识别
      smtp_port: ""     # 留空走自动识别
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""


# ===============================================================
# 6. 存储配置
# ===============================================================
storage:
  # auto = GitHub Actions 时优先用远程；否则用本地
  backend: "auto"

  # 数据格式
  formats:
    sqlite: true
    txt: false
    html: true   # 邮件必须开

  # 本地存储
  local:
    data_dir: "output"
    retention_days: 0   # 0 = 永久

  # 远程存储（S3 兼容），你目前可以先不管
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""

  # 从远程拉取数据（一般用不到）
  pull:
    enabled: false
    days: 7


# ===============================================================
# 7. AI 分析功能
# ===============================================================
ai_analysis:
  enabled: true         # 如果暂时没配 AI_API_KEY，也可以先 true，不影响抓取
  provider: "deepseek"
  api_key: ""           # 建议用环境变量 AI_API_KEY
  model: "deepseek-chat"
  base_url: ""
  timeout: 90

  # 推送模式：only_analysis | both
  push_mode: "both"

  # 参与分析的新闻条数上限
  max_news_for_analysis: 50

  # 是否把 RSS 一起拿去分析
  include_rss: false

  # 提示词文件
  prompt_file: "ai_analysis_prompt.txt"


# ===============================================================
# 8. 高级设置（一般不用动）
# ===============================================================
advanced:
  debug: false

  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"

  # 爬虫设置（热榜）
  crawler:
    enabled: true
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"

  # RSS 抓取设置
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""
    notification_enabled: true

  # 排序权重（不用动）
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1

  # 多账号限制
  max_accounts_per_channel: 3

  # 消息分批大小
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000

  # 批次发送间隔（秒）
  batch_send_interval: 3

  # 飞书分隔线
  feishu_message_separator: "━━━━━━━━━━━━━━━━━━━"
